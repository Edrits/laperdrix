<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>money.js tests</title>
<style>
 body{font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#171b14;color:#ebe4d3;
   margin:0;padding:24px;max-width:900px}
 h1{font:600 20px/1.2 Georgia,serif;margin:0 0 4px}
 .sum{margin:0 0 20px;padding:11px 14px;border-radius:8px;font-weight:600}
 .sum.ok{background:#233020;color:#9fd48f}
 .sum.bad{background:#3a2018;color:#f0a48c}
 h2{font:600 12px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
   color:#8e9583;margin:22px 0 8px;border-bottom:1px solid #2d3328;padding-bottom:6px}
 .t{padding:3px 0;display:flex;gap:10px;align-items:baseline}
 .t.pass::before{content:"✓";color:#7fb96a;flex:none;width:14px}
 .t.fail::before{content:"✗";color:#e07d55;flex:none;width:14px}
 .t.fail{color:#f0a48c}
 .exp{color:#8e9583}
</style>
</head>
<body>
<h1>money.js</h1>
<div id="summary" class="sum">running…</div>
<div id="out"></div>

<script src="money.js"></script>
<script src="rota.js"></script>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;

function group(name){ const h = document.createElement('h2'); h.textContent = name; out.appendChild(h); }
function show(ok, label, detail){
  const d = document.createElement('div');
  d.className = 't ' + (ok ? 'pass' : 'fail');
  d.innerHTML = label + (detail ? ' <span class="exp">' + detail + '</span>' : '');
  out.appendChild(d);
  ok ? pass++ : fail++;
}
function eq(actual, expected, label){
  const ok = Object.is(actual, expected) ||
             (typeof actual === 'number' && typeof expected === 'number' && Math.abs(actual - expected) < 1e-9);
  show(ok, label, ok ? '' : `— got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`);
}
function deep(actual, expected, label){
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  show(a === b, label, a === b ? '' : `— got ${a}, expected ${b}`);
}

const M = window.Money;

/* ----------------------------------------------------------- parseAmount */
group('parseAmount — French receipts are the dangerous case');
eq(M.parseAmount('12,50'), 12.5,      '"12,50" is twelve-fifty, NOT 1250');
eq(M.parseAmount('12.50'), 12.5,      '"12.50"');
eq(M.parseAmount('0,99'), 0.99,       '"0,99"');
eq(M.parseAmount('12,5'), 12.5,       '"12,5" — one decimal digit');
eq(M.parseAmount('1 234,56'), 1234.56,'"1 234,56" — space thousands');
eq(M.parseAmount('1 234,56'), 1234.56, 'non-breaking space thousands');
eq(M.parseAmount('1 234,56'), 1234.56, 'narrow no-break space thousands');
eq(M.parseAmount('1.234,56'), 1234.56,'"1.234,56" — French full form');
eq(M.parseAmount('1,234.56'), 1234.56,'"1,234.56" — English full form');
eq(M.parseAmount('1,234'), 1234,      '"1,234" — three trailing digits means thousands');
eq(M.parseAmount('1.234'), 1234,      '"1.234" — likewise');
eq(M.parseAmount('142,60 €'), 142.6,  'trailing euro sign');
eq(M.parseAmount('€142,60'), 142.6,   'leading euro sign');
eq(M.parseAmount('TOTAL 217,00'), 217, 'stray letters ignored');
eq(M.parseAmount(1234.567), 1234.57,  'a number rounds to 2dp');
eq(M.parseAmount('-5,25'), -5.25,     'negative');

group('parseAmount — refuses rather than guesses');
eq(M.parseAmount(''), null,           'empty string');
eq(M.parseAmount('   '), null,        'whitespace only');
eq(M.parseAmount('abc'), null,        'letters only');
eq(M.parseAmount('12,345,678'), 12345678, '"12,345,678" is twelve million, English style');
eq(M.parseAmount('12,3456'), null,    'four decimal digits is not a money amount');
eq(M.parseAmount('12.3456'), null,    'likewise with a dot');
eq(M.parseAmount('..'), null,         'separators with no digits');
eq(M.parseAmount(null), null,         'null');
eq(M.parseAmount(undefined), null,    'undefined');
eq(M.parseAmount(NaN), null,          'NaN');

/* ------------------------------------------------------------ conversion */
group('currency conversion');
eq(M.toHome(100, 0.85), 85,           '€100 at 0.85 is £85');
eq(M.toHome(142.6, 0.85), 121.21,     '€142.60 → £121.21 (rounded)');
eq(M.toLocal(85, 0.85), 100,          '£85 back to €100');
eq(M.toHome(100, 0), null,            'a zero rate is refused');
eq(M.toHome(100, -1), null,           'a negative rate is refused');
eq(M.toHome('100', 0.85), null,       'a string amount is refused');

group('formatMoney');
eq(M.formatMoney(1234.5, 'EUR'), '€1,234.50', 'thousands separator');
eq(M.formatMoney(0, 'GBP'), '£0.00',          'zero');
eq(M.formatMoney(-12.3, 'GBP'), '−£12.30',    'negative uses a real minus sign');
eq(M.formatMoney(NaN, 'EUR'), '—',            'not-a-number shows a dash');

/* ---------------------------------------------------------------- shares */
const people = [
  { id: 'a', name: 'Ed' },
  { id: 'b', name: 'Kate' },
  { id: 'c', name: 'Sam' },
];
const evenly = [
  { paidBy: 'a', amountHome: 90, beneficiaries: null },
];

group('summarise — the even case');
{
  const s = M.summarise(people, evenly, 'per_person');
  eq(s.find(x => x.id === 'a').paid, 90,     'Ed paid 90');
  eq(s.find(x => x.id === 'a').share, 30,    'his share is 30');
  eq(s.find(x => x.id === 'a').balance, 60,  'so he is 60 up');
  eq(s.find(x => x.id === 'b').balance, -30, 'Kate is 30 down');
  eq(M.round2(s.reduce((t, x) => t + x.balance, 0)), 0, 'balances sum to zero');
}

group('summarise — a cost that was not for everyone');
{
  const s = M.summarise(people, [
    { paidBy: 'a', amountHome: 60, beneficiaries: ['a', 'b'] },
  ], 'per_person');
  eq(s.find(x => x.id === 'a').share, 30, 'Ed shares it');
  eq(s.find(x => x.id === 'b').share, 30, 'Kate shares it');
  eq(s.find(x => x.id === 'c').share, 0,  'Sam was not on the boat trip');
}

group('summarise — split_basis "none" really computes nothing');
{
  const s = M.summarise(people, evenly, 'none');
  eq(s.find(x => x.id === 'a').paid, 90,    'still shows what was paid');
  eq(s.find(x => x.id === 'a').share, 0,    'but no share is computed');
  eq(s.find(x => x.id === 'a').balance, 0,  'and nobody is up or down');
  eq(s.find(x => x.id === 'c').balance, 0,  'including people who paid nothing');
}

group('summarise — people who do not count toward a share');
{
  const withBaby = people.concat([{ id: 'd', name: 'Baby', counts: false }]);
  const s = M.summarise(withBaby, evenly, 'per_person');
  eq(s.find(x => x.id === 'd').share, 0,  'the baby is charged nothing');
  eq(s.find(x => x.id === 'a').share, 30, 'and the others still split three ways');
}

group('summarise — awkward inputs');
{
  eq(M.summarise(people, [], 'per_person').every(x => x.balance === 0), true, 'no expenses is not a crash');
  eq(M.summarise([], evenly, 'per_person').length, 0, 'no people is not a crash');
  const s = M.summarise(people, [{ paidBy: 'ghost', amountHome: 30, beneficiaries: null }], 'per_person');
  eq(M.round2(s.reduce((t, x) => t + x.paid, 0)), 0, 'a payer who no longer exists contributes nothing');
  const s2 = M.summarise(people, [{ paidBy: 'a', amountHome: 30, beneficiaries: ['gone'] }], 'per_person');
  eq(s2.find(x => x.id === 'a').share, 10, 'beneficiaries who were removed fall back to everyone');
}

/* ------------------------------------------------------------- transfers */
group('levellingTransfers');
{
  const s = M.summarise(people, evenly, 'per_person');
  const t = M.levellingTransfers(s);
  eq(t.length, 2, 'two payments settle three people');
  eq(M.round2(t.reduce((x, y) => x + y.amount, 0)), 60, 'and they total 60');
  eq(t.every(x => x.to === 'a'), true, 'both go to the person who is up');
}
{
  const flat = [{ id: 'a', paid: 10, share: 10, balance: 0 },
                { id: 'b', paid: 10, share: 10, balance: 0 }];
  deep(M.levellingTransfers(flat), [], 'nobody owes anything when it is already level');
}
{
  const tiny = [{ id: 'a', balance: 0.004 }, { id: 'b', balance: -0.004 }];
  deep(M.levellingTransfers(tiny), [], 'rounding dust does not generate a payment');
}

/* -------------------------------------------------------- spendByPerson */
group('spendByPerson — everybody gets a row');
{
  const r = M.spendByPerson(people, [
    { paidBy: 'a', amountLocal: 100, amountHome: 85 },
  ]);
  eq(r.length, 3,                          'three people in, three rows out');
  deep(r.map(x => x.id), ['a', 'b', 'c'],  'including the two who spent nothing');
  const sam = r.find(x => x.id === 'c');
  deep([sam.paidLocal, sam.paidHome, sam.count, sam.fraction], [0, 0, 0, 0],
       'a person who has spent nothing is all zeroes');
  eq(r.find(x => x.id === 'a').count, 1,   'and the payer has one expense');
}

group('spendByPerson — a payer who is no longer on the trip');
{
  const r = M.spendByPerson(people, [
    { paidBy: 'a', amountLocal: 20, amountHome: 17 },
    { paidBy: 'ghost', amountLocal: 500, amountHome: 425 },
  ]);
  eq(r.length, 3,                                   'no phantom row for the ghost');
  eq(r.some(x => x.id === 'ghost'), false,          'really not there');
  eq(M.round2(r.reduce((t, x) => t + x.paidHome, 0)), 17, 'and their spend is ignored');
}

group('spendByPerson — rounding and junk amounts');
{
  const r = M.spendByPerson(people, [
    { paidBy: 'a', amountLocal: 1.005, amountHome: 2.675 },
    { paidBy: 'b', amountLocal: 0.1,   amountHome: 0.1 },
    { paidBy: 'b', amountLocal: 0.2,   amountHome: 0.2 },
  ]);
  const ed = r.find(x => x.id === 'a'), kate = r.find(x => x.id === 'b');
  eq(ed.paidLocal, 1.01,   'paidLocal is rounded with round2');
  eq(ed.paidHome, 2.68,    'paidHome likewise');
  eq(kate.paidHome, 0.3,   '0.1 + 0.2 is 0.3, not 0.30000000000000004');
}
{
  const r = M.spendByPerson(people, [
    { paidBy: 'a', amountLocal: 'x',      amountHome: undefined },
    { paidBy: 'a', amountLocal: NaN,      amountHome: Infinity },
    { paidBy: 'a', amountLocal: 10,       amountHome: 8 },
  ]);
  const ed = r.find(x => x.id === 'a');
  eq(ed.paidLocal, 10,  'unreadable amounts count as 0, never NaN');
  eq(ed.paidHome, 8,    'missing and non-finite amounts likewise');
  eq(ed.count, 3,       'but they are still three expenses he logged');
}

group('spendByPerson — fraction drives the bar widths');
{
  const r = M.spendByPerson(people, [
    { paidBy: 'a', amountLocal: 100, amountHome: 100 },
    { paidBy: 'b', amountLocal: 25,  amountHome: 25 },
  ]);
  eq(r.find(x => x.id === 'a').fraction, 1,    'the top spender is exactly 1');
  eq(r.find(x => x.id === 'b').fraction, 0.25, '25 against a top of 100 is 0.25');
  eq(r.find(x => x.id === 'c').fraction, 0,    'and nothing spent is 0');
}
{
  const r = M.spendByPerson(people, []);
  eq(r.every(x => x.fraction === 0), true, 'nobody has spent anything: every fraction is 0');
}

group('spendByPerson — the order is deterministic');
{
  const r = M.spendByPerson(people, [
    { paidBy: 'c', amountLocal: 10, amountHome: 10 },
    { paidBy: 'a', amountLocal: 90, amountHome: 90 },
    { paidBy: 'b', amountLocal: 50, amountHome: 50 },
  ]);
  deep(r.map(x => x.id), ['a', 'b', 'c'], 'biggest spender first');
}
{
  // Level on money: the one with more expenses comes first.
  const r = M.spendByPerson(people, [
    { paidBy: 'c', amountLocal: 40, amountHome: 40 },
    { paidBy: 'a', amountLocal: 20, amountHome: 20 },
    { paidBy: 'a', amountLocal: 20, amountHome: 20 },
  ]);
  deep(r.map(x => x.id), ['a', 'c', 'b'], 'a tie on total breaks on the number of expenses');
}
{
  // Level on money and on count: id decides, whatever order they arrived in.
  const spend = [
    { paidBy: 'c', amountLocal: 30, amountHome: 30 },
    { paidBy: 'a', amountLocal: 30, amountHome: 30 },
  ];
  const r = M.spendByPerson(people, spend);
  deep(r.map(x => x.id), ['a', 'c', 'b'], 'a full tie breaks on id');
  const reversed = M.spendByPerson(people.slice().reverse(), spend.slice().reverse());
  deep(reversed.map(x => x.id), ['a', 'c', 'b'], 'and does not flicker if the inputs are reordered');
  deep(r.map(x => x.fraction), [1, 1, 0], 'two people level at the top are both 1');
}

group('spendByPerson — awkward inputs');
{
  const r = M.spendByPerson(people, []);
  eq(r.length, 3, 'no expenses is not a crash');
  deep(r.map(x => x.paidHome), [0, 0, 0], 'and everybody is on zero');
  deep(r.map(x => x.id), ['a', 'b', 'c'], 'still in a stable order');
}
deep(M.spendByPerson([], evenly), [], 'no people is not a crash');
deep(M.spendByPerson([], []), [],     'neither is nothing at all');

/* ------------------------------------------------------------ households */
const ritchies = [
  { id: 'r1', name: 'Ed',   household: 'Ritchie' },
  { id: 'r2', name: 'Kate', household: ' ritchie ' },
  { id: 'p1', name: 'Pip' },
];

group('householdsOf — a family is one group, a loner is a group of one');
{
  const g = M.householdsOf(ritchies);
  eq(g.length, 2,                     'three people, two groups');
  deep(g.map(x => x.key), ['hh:ritchie', 'me:p1'], 'families are hh:, loners are me:');
  deep(g[0].ids, ['r1', 'r2'],        'both Ritchies are in the family group');
  deep(g[1].ids, ['p1'],              'Pip stands alone as a group of one');
}
{
  const g = M.householdsOf(ritchies);
  eq(g[0].label, 'Ritchie',  'case and surrounding whitespace do not split a family');
  eq(g[1].label, 'Pip',      'somebody with no household is labelled with their name');
}
{
  // The label is the FIRST spelling seen, not the tidiest one.
  const g = M.householdsOf([
    { id: 'a', name: 'Ed',   household: 'ritchie' },
    { id: 'b', name: 'Kate', household: 'Ritchie' },
  ]);
  eq(g.length, 1,           'one family however it was typed');
  eq(g[0].label, 'ritchie', 'and the label keeps the first spelling');
}
{
  const g = M.householdsOf([
    { id: 'a', name: 'Ed', household: '   ' },
    { id: 'b', name: 'Kate', household: '' },
    { id: 'c', name: 'Sam' },
    { id: 'd', name: 'Jo', household: null },
  ]);
  deep(g.map(x => x.key), ['me:a', 'me:b', 'me:c', 'me:d'],
       'blank, empty, missing and non-string households all mean no family');
}
{
  const g = M.householdsOf([{ id: 'x', name: 'Sam', household: 'Bell' }]);
  deep(g, [{ key: 'hh:bell', label: 'Bell', ids: ['x'] }],
       'a household of exactly one person is still a household');
}

group('spendByHousehold — the family folds into one row');
{
  const r = M.spendByHousehold(ritchies, [
    { paidBy: 'r1', amountLocal: 100, amountHome: 85 },
    { paidBy: 'r2', amountLocal: 40,  amountHome: 34 },
    { paidBy: 'p1', amountLocal: 20,  amountHome: 17 },
  ]);
  eq(r.length, 2,                       'two groups, two rows');
  const fam = r.find(x => x.key === 'hh:ritchie');
  eq(fam.paidHome, 119,                 "the family's paidHome is 85 + 34");
  eq(fam.paidLocal, 140,                'and paidLocal likewise');
  eq(fam.count, 2,                      'with both their entries counted');
  eq(fam.label, 'Ritchie',              'labelled with the family name');
  deep(fam.ids, ['r1', 'r2'],           'and carrying its members');
  const pip = r.find(x => x.key === 'me:p1');
  eq(pip.paidHome, 17,                  'Pip is her own group of one');
  eq(pip.label, 'Pip',                  'labelled with her name');
}
{
  const r = M.spendByHousehold(ritchies, [
    { paidBy: 'r1',    amountLocal: 20,  amountHome: 17 },
    { paidBy: 'ghost', amountLocal: 500, amountHome: 425 },
  ]);
  eq(r.length, 2,                                         'no phantom group for the ghost');
  eq(M.round2(r.reduce((t, x) => t + x.paidHome, 0)), 17, 'and their spend is ignored');
}
{
  const r = M.spendByHousehold(ritchies, [
    { paidBy: 'r1', amountLocal: 0.1, amountHome: 0.1 },
    { paidBy: 'r2', amountLocal: 0.2, amountHome: 0.2 },
  ]);
  eq(r.find(x => x.key === 'hh:ritchie').paidHome, 0.3,
     'a family total is rounded once, not accumulated from rounded members');
}

group('spendByHousehold — fraction drives the bar widths');
{
  const four = [
    { id: 'r1', name: 'Ed',   household: 'Ritchie' },
    { id: 'r2', name: 'Kate', household: 'Ritchie' },
    { id: 'b1', name: 'Sam',  household: 'Bell' },
    { id: 'p1', name: 'Pip' },
  ];
  const r = M.spendByHousehold(four, [
    { paidBy: 'r1', amountLocal: 60, amountHome: 60 },
    { paidBy: 'r2', amountLocal: 40, amountHome: 40 },
    { paidBy: 'b1', amountLocal: 25, amountHome: 25 },
  ]);
  deep(r.map(x => x.key), ['hh:ritchie', 'hh:bell', 'me:p1'], 'biggest household first');
  eq(r.find(x => x.key === 'hh:ritchie').fraction, 1,    'the top household is exactly 1');
  eq(r.find(x => x.key === 'hh:bell').fraction, 0.25,    '25 against a top of 100 is 0.25');
  eq(r.find(x => x.key === 'me:p1').fraction, 0,         'and nothing spent is 0');
}
{
  // Level on money and on count: the group key decides, deterministically.
  const two = [
    { id: 'b1', name: 'Sam', household: 'Bell' },
    { id: 'a1', name: 'Ann', household: 'Arnaud' },
  ];
  const spend = [
    { paidBy: 'b1', amountLocal: 30, amountHome: 30 },
    { paidBy: 'a1', amountLocal: 30, amountHome: 30 },
  ];
  deep(M.spendByHousehold(two, spend).map(x => x.key), ['hh:arnaud', 'hh:bell'],
       'a full tie breaks on the group key');
  deep(M.spendByHousehold(two.slice().reverse(), spend.slice().reverse()).map(x => x.key),
       ['hh:arnaud', 'hh:bell'], 'and does not flicker if the inputs are reordered');
}

group('summariseHouseholds — a family of three carries THREE shares');
{
  // The fairness property. A household aggregates shares already computed per
  // head; it never becomes a single share, or a couple with three children
  // would pay the same as a lone adult.
  const trio = [
    { id: 'r1', name: 'Ed',   household: 'Ritchie' },
    { id: 'r2', name: 'Kate', household: 'Ritchie' },
    { id: 'r3', name: 'Nell', household: 'Ritchie' },
    { id: 'p1', name: 'Pip' },
  ];
  const s = M.summariseHouseholds(trio, [
    { paidBy: 'p1', amountHome: 120, beneficiaries: null },
  ]);
  const fam = s.find(x => x.id === 'hh:ritchie'), pip = s.find(x => x.id === 'me:p1');
  eq(fam.share, 90,             'the family of three is charged three shares of 30');
  eq(pip.share, 30,             'the lone adult is charged one');
  eq(fam.share / pip.share, 3,  'exactly three times, which must never regress');
  eq(pip.paid, 120,             'Pip put the whole 120 in');
  eq(fam.balance, -90,          'so the family is 90 down');
  eq(pip.balance, 90,           'and Pip is 90 up');
  eq(M.round2(s.reduce((t, x) => t + x.balance, 0)), 0, 'household balances sum to zero');
  deep(s.map(x => Object.keys(x)), [['id','paid','share','balance'], ['id','paid','share','balance']],
       'the shape is summarise()-shaped, so levellingTransfers eats it unchanged');
}

group('summariseHouseholds — a member who does not count');
{
  const withBaby = [
    { id: 'r1', name: 'Ed',   household: 'Ritchie' },
    { id: 'r2', name: 'Kate', household: 'Ritchie' },
    { id: 'r3', name: 'Baby', household: 'Ritchie', counts: false },
    { id: 'p1', name: 'Pip' },
  ];
  const s = M.summariseHouseholds(withBaby, [
    { paidBy: 'r1', amountHome: 90, beneficiaries: null },
  ]);
  const fam = s.find(x => x.id === 'hh:ritchie');
  eq(fam.share, 60,   'the baby carries no share, so the family carries two, not three');
  eq(fam.paid, 90,    'but what the family paid is untouched by that');
  eq(fam.balance, 30, 'leaving them 30 up');
  eq(s.find(x => x.id === 'me:p1').share, 30, 'and the split is three ways, not four');
}

group('summariseHouseholds — feeds levellingTransfers');
{
  const four = [
    { id: 'r1', name: 'Ed',   household: 'Ritchie' },
    { id: 'r2', name: 'Kate', household: 'Ritchie' },
    { id: 'b1', name: 'Sam',  household: 'Bell' },
    { id: 'p1', name: 'Pip' },
  ];
  const s = M.summariseHouseholds(four, [
    { paidBy: 'r1', amountHome: 120, beneficiaries: null },
  ]);
  const t = M.levellingTransfers(s);
  const keys = new Set(M.householdsOf(four).map(g => g.key));
  eq(t.every(x => keys.has(x.from) && keys.has(x.to)), true,
     'every transfer is keyed by group key, not by person id');
  eq(t.every(x => x.to === 'hh:ritchie'), true, 'all of them go to the family that paid');
  eq(M.round2(t.reduce((x, y) => x + y.amount, 0)), 60,
     'and they total the 60 the Ritchies are up');
  eq(t.length, 2, 'two payments level three households');
}
{
  const s = M.summariseHouseholds(ritchies, [{ paidBy: 'r1', amountHome: 90 }], 'none');
  eq(s.find(x => x.id === 'hh:ritchie').paid, 90, "basis 'none' still shows what was paid");
  eq(s.every(x => x.share === 0 && x.balance === 0), true, 'but computes no shares at all');
}

group('households — awkward inputs');
{
  deep(M.householdsOf([]), [],          'no people is not a crash');
  deep(M.spendByHousehold([], []), [],  'neither is nothing at all');
  deep(M.summariseHouseholds([], []), [], 'nor summarising nobody');
  deep(M.spendByHousehold(ritchies, []).map(x => x.paidHome), [0, 0], 'no expenses: everybody on zero');
  eq(M.spendByHousehold(ritchies, []).every(x => x.fraction === 0), true, 'and every fraction is 0');
  const s = M.summariseHouseholds(ritchies, []);
  eq(s.every(x => x.balance === 0), true, 'no expenses means nobody is up or down');
}
{
  const solo = [{ id: 'x', name: 'Sam', household: 'Bell' }];
  const r = M.spendByHousehold(solo, [{ paidBy: 'x', amountLocal: 10, amountHome: 8 }]);
  eq(r.length, 1,          'a household of one behaves like any other');
  eq(r[0].paidHome, 8,     'with its own spend');
  eq(r[0].fraction, 1,     'and it is its own top');
  const s = M.summariseHouseholds(solo, [{ paidBy: 'x', amountHome: 8 }]);
  eq(s[0].balance, 0,      'and pays only for itself');
}

/* ---------------------------------------------------------------- totals */
group('total');
eq(M.total([{ amountHome: 1.1 }, { amountHome: 2.2 }]), 3.3, '1.1 + 2.2 is 3.3, not 3.3000000000000003');
eq(M.total([]), 0, 'empty');
eq(M.total([{ amountHome: 'x' }, { amountHome: 5 }]), 5, 'junk entries are skipped');
eq(M.total([{ amountLocal: 4 }], 'amountLocal'), 4, 'can total a different field');

/* =========================================================================
   rota.js — the cooking rota
   ========================================================================= */

const R = window.Rota;

/* The whole trip, and a cast that comes and goes. */
const NIGHTS = R.cookNights('2027-07-31', '2027-08-14');
const ALL = (n, from, to) => Array.from({length: n}, (_, i) => ({ id: 'p' + i, name: 'P' + i, from, to }));

group('cookNights — the last morning is not a dinner');
eq(NIGHTS.length, 14,             '31 Jul – 14 Aug is fourteen dinners, not fifteen');
eq(NIGHTS[0], '2027-07-31',       'first night is arrival day');
eq(NIGHTS[13], '2027-08-13',      'last night is the eve of departure');
eq(R.cookNights('2027-07-31', '2027-08-01').length, 1, 'a one-night stay is one dinner');

group('isHere — you cook on the night, not the morning you leave');
{
  const p = { id: 'a', from: '2027-08-02', to: '2027-08-05' };
  eq(R.isHere(p, '2027-08-01'), false, 'not before arriving');
  eq(R.isHere(p, '2027-08-02'), true,  'the night you arrive');
  eq(R.isHere(p, '2027-08-04'), true,  'the night before you go');
  eq(R.isHere(p, '2027-08-05'), false, 'NOT the morning you drive home');
  eq(R.isHere({ id: 'b' }, '2027-08-02'), false, 'no dates means not here');
}

group('teamSizeFor — the team grows with the table');
eq(R.teamSizeFor(27), 5,  '27 for dinner needs five cooks');
eq(R.teamSizeFor(20), 3,  '20 needs three');
eq(R.teamSizeFor(12), 2,  '12 needs two');
eq(R.teamSizeFor(3),  2,  'never a lone cook when there is company');
eq(R.teamSizeFor(1),  1,  'unless there is genuinely only one person here');
eq(R.teamSizeFor(0),  0,  'nobody here, nobody cooks');
eq(R.teamSizeFor(90), 6,  'capped — past six they are in each other\'s way');

group('buildRota — fairness is a share of your own nights');
{
  const people = ALL(12, '2027-07-31', '2027-08-14');
  const rota = R.buildRota(people, NIGHTS, { seed: 'x' });
  eq(rota.length, 14, 'a team for every night');
  show(rota.every(n => n.team.length === n.size), 'every night is fully crewed');
  show(rota.every(n => new Set(n.team).size === n.team.length), 'nobody is on the same team twice');
  show(rota.every(n => n.team.every(id => n.present.includes(id))),
       'nobody is rostered on a night they are not here');

  const spread = R.load(rota, people).map(l => l.times);
  show(Math.max(...spread) - Math.min(...spread) <= 1,
       'with everyone here all fortnight, the load differs by at most one night');
}

{
  // The property that matters most: a three-night guest and a fortnight-long
  // one should cook the same SHARE, not the same number of times.
  const people = [
    ...ALL(8, '2027-07-31', '2027-08-14'),
    { id: 'short', name: 'Short', from: '2027-08-05', to: '2027-08-08' },
  ];
  const rota = R.buildRota(people, NIGHTS, { seed: 'y' });
  const l = R.load(rota, people);
  const short = l.find(x => x.id === 'short');
  const long = l.find(x => x.id === 'p0');
  eq(short.nights, 3, 'the short stay is three cook-nights');
  show(short.times < long.times, 'so they cook fewer times in absolute terms');
  show(Math.abs(short.share - long.share) < 0.34,
       'but a comparable share of the nights they were actually here');
}

group('buildRota — a short stay still gets its turn');
{
  /* This is a real bug that shipped in the first draft: scoring people by the
     share they had cooked so far couldn't tell that somebody leaving on
     Wednesday had run out of chances, so a four-night guest cooked ZERO times
     while everyone else did three. Their last evening has to become urgent. */
  const people = [
    ...ALL(8, '2027-07-31', '2027-08-14'),
    { id: 'early', name: 'Leaves early', from: '2027-07-31', to: '2027-08-04' }, // 4 nights
    { id: 'late',  name: 'Arrives late', from: '2027-08-10', to: '2027-08-14' }, // 4 nights
  ];
  const l = R.load(R.buildRota(people, NIGHTS, { seed: 'sam' }), people);
  show(l.find(x => x.id === 'early').times >= 1, 'somebody there four nights at the start cooks at least once');
  show(l.find(x => x.id === 'late').times  >= 1, 'and somebody there four nights at the end does too');

  // And it must hold whatever the seed, not just a lucky one.
  let missed = 0;
  for (let s = 0; s < 25; s++) {
    const r = R.load(R.buildRota(people, NIGHTS, { seed: 'seed' + s }), people);
    if (r.find(x => x.id === 'early').times === 0) missed++;
    if (r.find(x => x.id === 'late').times === 0) missed++;
  }
  eq(missed, 0, 'across 25 different seeds, never once skipped');
}

group('buildRota — nobody cooks two nights running when there is a choice');
{
  const people = ALL(14, '2027-07-31', '2027-08-14');
  const rota = R.buildRota(people, NIGHTS, { seed: 'z' });
  let backToBack = 0;
  for (let i = 1; i < rota.length; i++)
    for (const id of rota[i].team) if (rota[i - 1].team.includes(id)) backToBack++;
  eq(backToBack, 0, 'no repeats on consecutive nights with fourteen people to choose from');
}
{
  // ...but it must still produce a team when there is nobody else left.
  const people = ALL(2, '2027-07-31', '2027-08-14');
  const rota = R.buildRota(people, NIGHTS, { seed: 'z' });
  show(rota.every(n => n.team.length === 2),
       'with only two people it rosters them every night rather than giving up');
}

group('buildRota — deterministic, so "scramble" means something');
{
  const people = ALL(10, '2027-07-31', '2027-08-14');
  const a = R.buildRota(people, NIGHTS, { seed: 'same' });
  const b = R.buildRota(people, NIGHTS, { seed: 'same' });
  const c = R.buildRota(people, NIGHTS, { seed: 'different' });
  deep(a.map(n => n.team), b.map(n => n.team), 'the same seed gives the same rota every time');
  show(JSON.stringify(a.map(n => n.team)) !== JSON.stringify(c.map(n => n.team)),
       'a new seed gives a different one');
}

group('buildRota — a hand-moved night is left alone');
{
  const people = ALL(10, '2027-07-31', '2027-08-14');
  const pins = { '2027-08-03': ['p7', 'p8'] };
  const rota = R.buildRota(people, NIGHTS, { seed: 'q', pins });
  const night = rota.find(n => n.day === '2027-08-03');
  deep(night.team, ['p7', 'p8'], 'the pinned team survives a rebuild');
  eq(night.pinned, true,          'and is marked as pinned');
  const l = R.load(rota, people);
  show(l.find(x => x.id === 'p7').times >= 1,
       'and still counts towards that person\'s load, so the rest stays fair');
}
{
  // A pin naming somebody who has since changed their dates must not roster a
  // person who isn't there — that would be worse than being wrong.
  const people = [{ id: 'a', from: '2027-07-31', to: '2027-08-14' },
                  { id: 'gone', from: '2027-07-31', to: '2027-08-01' }];
  const rota = R.buildRota(people, NIGHTS, { seed: 'q', pins: { '2027-08-03': ['a', 'gone'] } });
  deep(rota.find(n => n.day === '2027-08-03').team, ['a'],
       'a pinned person who has left is dropped from the night');
}

group('buildRota — the empty and awkward cases');
{
  deep(R.buildRota([], NIGHTS, {}).map(n => n.team), NIGHTS.map(() => []), 'no people, no teams');
  deep(R.buildRota(ALL(4, '2027-07-31', '2027-08-14'), [], {}), [], 'no nights, no rota');
  const noDates = [{ id: 'a', name: 'A' }, { id: 'b', name: 'B' }];
  show(R.buildRota(noDates, NIGHTS, {}).every(n => n.team.length === 0),
       'people who have not put their dates in are never rostered');
}

group('nightFor — what the front page asks');
{
  const rota = R.buildRota(ALL(6, '2027-07-31', '2027-08-14'), NIGHTS, { seed: 'n' });
  eq(R.nightFor(rota, '2027-08-03').day, '2027-08-03', 'tonight, when the trip is on');
  eq(R.nightFor(rota, '2026-01-01').day, '2027-07-31', 'the first night, when it has not started');
  eq(R.nightFor(rota, '2030-01-01'), null,             'nothing, once it is over');
}

/* ------------------------------------------------------------------ done */
const s = document.getElementById('summary');
s.className = 'sum ' + (fail ? 'bad' : 'ok');
s.textContent = fail ? `${fail} failing, ${pass} passing` : `all ${pass} passing`;
window.__results = { pass, fail };
</script>
</body>
</html>
