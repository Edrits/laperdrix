<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The kitty · La Perdrix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#e9e4d7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body class="kitty-page">

<header class="ktop">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6"/><path d="M12 5l-7 7 7 7"/></svg>
    La Perdrix
  </a>
  <div class="themes ktheme">
    <button id="t-light" aria-pressed="false">Light</button>
    <button id="t-dark" aria-pressed="false">Dark</button>
    <button id="t-auto" aria-pressed="true">Auto</button>
  </div>
</header>

<main>
  <section class="sec pot-sec">
    <p class="eyebrow">The kitty</p>
    <div class="pot-big">
      <span class="pot-local" id="potLocal">—</span>
      <span class="pot-home" id="potHome"></span>
    </div>
    <p class="pot-cap" id="potCap"></p>

    <div class="seg" role="tablist">
      <button class="seg-b on" id="tabSpend" role="tab" aria-selected="true">Spending</button>
      <button class="seg-b" id="tabBalance" role="tab" aria-selected="false">Balance</button>
    </div>
  </section>

  <!-- ---------------------------------------------------------- spending -->
  <section class="sec view" id="viewSpend">
    <div class="filters" id="phaseFilters">
      <button class="pill on" data-phase="all">Whole trip</button>
      <button class="pill" data-phase="pre_trip">Before we go</button>
      <button class="pill" data-phase="on_trip">Out there</button>
    </div>
    <div id="spendList"></div>
    <p class="empty-note" id="spendEmpty" hidden>Nothing in the kitty yet. Tap <b>Add spend</b> and say who paid for what.</p>
  </section>

  <!-- ----------------------------------------------------------- balance -->
  <section class="sec view" id="viewBalance" hidden>
    <div id="balanceList"></div>
    <p class="empty-note" id="balanceEmpty" hidden>Nothing to balance yet.</p>

    <div class="level" id="levelBox" hidden>
      <h3>If you wanted to level up</h3>
      <div id="levelList"></div>
      <p class="level-note">Only a suggestion. Nothing here is owed, and the trip doesn't need to balance.</p>
    </div>

    <div class="settings">
      <h3>Settings</h3>
      <div class="set-row">
        <label for="basis">Work out shares</label>
        <select id="basis">
          <option value="per_person">Evenly, per person</option>
          <option value="none">Don't — just show who paid</option>
        </select>
      </div>
      <div class="set-row">
        <label for="rate">£ per €</label>
        <input id="rate" type="text" inputmode="decimal" size="8">
      </div>
      <p class="set-note" id="rateNote"></p>
    </div>
  </section>
</main>

<div class="bar"><button class="btn" id="addBtn">＋ Add spend</button></div>

<!-- ------------------------------------------------------------ the form -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="in2">
    <h2 id="fTitle">Add spend</h2>

    <label for="fAmount">How much</label>
    <div class="amount-row">
      <input id="fAmount" type="text" inputmode="decimal" enterkeyhint="next" placeholder="0,00" autocomplete="off">
      <div class="ccy" id="fCcy">
        <button type="button" class="ccy-b on" data-ccy="EUR">€</button>
        <button type="button" class="ccy-b" data-ccy="GBP">£</button>
      </div>
    </div>
    <p class="conv" id="fConv"></p>

    <label id="payLabel">Who paid</label>
    <div class="payers" id="fPayers" role="group" aria-labelledby="payLabel"></div>
    <input id="fNewName" type="text" maxlength="40" placeholder="Their name" autocomplete="off" hidden>

    <label id="tagLabel">What for</label>
    <div class="tags" id="fTags" role="group" aria-labelledby="tagLabel"></div>
    <input id="fDetail" type="text" maxlength="60" placeholder="Anything worth adding (optional)" autocomplete="off">

    <label for="fWhen">When</label>
    <input id="fWhen" type="date">
    <p class="conv" id="fPhase"></p>

    <label id="forLabel">Who it was for</label>
    <div class="forwho" role="group" aria-labelledby="forLabel">
      <button type="button" class="pill on" id="forAll">Everyone</button>
      <button type="button" class="pill" id="forSome">Just some of us</button>
    </div>
    <div class="somePick" id="somePick" hidden></div>

    <div class="row">
      <button class="btn ghost" id="fCancel">Cancel</button>
      <button class="btn" id="fSave" disabled>Save</button>
    </div>
    <button class="remove" id="fDelete" hidden>Delete this</button>
  </div>
</div>

<script src="icons.js?v=5"></script>
<script src="sync.js?v=2"></script>
<script src="money.js?v=1"></script>
<script>
/* =========================================================================
   The kitty.

   Ed's framing, which governs every decision in here:
     "a spending tracker so we can keep an eye on the balance, not a direct
      accounting tool which helps settle"

   So: it shows what people have put in. It never tells anyone they owe anyone
   money. The levelling suggestions exist but are framed as optional and carry
   an explicit line saying nothing is owed.

   NO SETUP. The whole of logging a spend is: how much, who paid, what for.
   An earlier version hid the Add button until somebody had made a profile on
   the landing page AND this device had said which person it was — two hoops
   before you could record that Ed paid 150 for the food shop. Now an unknown
   payer is just a name you type, and the person is created behind the scenes.
   ========================================================================= */

const TRIP = Sync.TRIP;

const K_ME   = 'laperdrix.me';        // last payer on this device, used as a default
const K_CONF = 'laperdrix.kitty.v1';

/* Tags rather than free text: a list you can tap is faster than typing on a
   phone, and it makes the spending groupable later. The detail field is always
   there for anything a tag doesn't cover. */
const TAGS = ['Food shop', 'Restaurant', 'Drinks', 'Market', 'Fuel', 'Tolls',
              'Activities', 'The house', 'Travel', 'Other'];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const D = s => new Date(s + 'T12:00:00Z');
const pad = v => String(v).padStart(2, '0');
const todayISO = () => { const n = new Date(); return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()); };
function dayLabel(iso){
  const d = D(iso);
  if (isNaN(d)) return String(iso);
  return DOWL[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()];
}

function read(key, fallback){
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch { return fallback; }
}
function write(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

/* ------------------------------------------------------------- the data */

function loadPeople(){
  const raw = Sync.people();
  if (!Array.isArray(raw)) return [];
  return raw.filter(p => p && p.name).map((p, i) => ({
    id: p.id, name: p.name,
    icon: p.icon || window.ICONS[i % window.ICONS.length][0],
    counts: p.counts !== false,
  }));
}

let people   = loadPeople();
let expenses = Sync.expenses();
let conf     = Object.assign({ fxRate: 0.85, fxAt: null, fxSource: 'default', basis: 'per_person' }, read(K_CONF, {}));
let view     = 'spend';
let phase    = 'all';
let draft    = null;

const personById = id => people.find(p => p.id === id);
const phaseOf = iso => (iso < TRIP.start ? 'pre_trip' : 'on_trip');
const fmtL = v => Money.formatMoney(v, 'EUR');
const fmtH = v => Money.formatMoney(v, 'GBP');

/* Give a new person the first icon nobody has taken, so two people don't end up
   as the same partridge without having chosen to. */
function freeIcon(){
  const taken = new Set(people.map(p => p.icon));
  const spare = window.ICONS.find(i => !taken.has(i[0]));
  return (spare || window.ICONS[people.length % window.ICONS.length])[0];
}

/* ------------------------------------------------------------ rendering */

const visible = () => expenses.filter(e => phase === 'all' || e.phase === phase);

function renderPot(){
  const list = visible();
  const payers = new Set(list.map(e => e.paidBy).filter(id => personById(id))).size;
  $('potLocal').textContent = fmtL(Money.total(list, 'amountLocal'));
  $('potHome').textContent = list.length ? '≈ ' + fmtH(Money.total(list, 'amountHome')) : '';
  $('potCap').textContent = list.length
    ? `${list.length} ${list.length === 1 ? 'entry' : 'entries'} · ${payers} ${payers === 1 ? 'person' : 'people'} chipping in`
    : 'Nothing in it yet';
}

function renderSpend(){
  const list = visible().slice().sort((a, b) =>
    String(b.spentOn).localeCompare(String(a.spentOn)) || (b.createdAt || 0) - (a.createdAt || 0));
  $('spendEmpty').hidden = list.length > 0;

  const byDay = new Map();
  for (const e of list) {
    if (!byDay.has(e.spentOn)) byDay.set(e.spentOn, []);
    byDay.get(e.spentOn).push(e);
  }

  $('spendList').innerHTML = [...byDay.entries()].map(([day, items]) => {
    const rows = items.map(e => {
      const payer = personById(e.paidBy);
      const some = e.beneficiaries && e.beneficiaries.length
        ? `<span class="tag">${e.beneficiaries.length} of ${people.filter(p=>p.counts).length}</span>` : '';
      const detail = e.what ? esc(e.what) + ' · ' : '';
      return `<button class="erow" data-id="${esc(e.id)}">
        <span class="eav" style="background:${payer ? colourOf(payer.icon) : 'var(--mut)'}">${payer ? iconOf(payer.icon) : ''}</span>
        <span class="emain">
          <span class="edesc">${esc(e.category || e.what || 'Spending')} ${some}</span>
          <span class="emeta">${detail}${payer ? esc(payer.name) : 'someone who has left'}</span>
        </span>
        <span class="eamt">
          <span class="eloc">${fmtL(e.amountLocal)}</span>
          <span class="ehome">${fmtH(e.amountHome)}</span>
        </span>
      </button>`;
    }).join('');
    return `<section class="day-group">
      <div class="day-head"><span class="day-name">${dayLabel(day)}</span><span class="day-sum">${fmtL(Money.total(items,'amountLocal'))}</span></div>
      ${rows}
    </section>`;
  }).join('');
}

function renderBalance(){
  const summary = Money.summarise(people, expenses, conf.basis);
  $('balanceEmpty').hidden = expenses.length > 0;
  const most = Math.max(1, ...summary.map(s => s.paid));

  $('balanceList').innerHTML = summary
    .slice().sort((a, b) => b.paid - a.paid)
    .map(s => {
      const p = personById(s.id);
      if (!p) return '';
      const diff = conf.basis === 'none' ? '' :
        (Math.abs(s.balance) < 0.01
          ? '<span class="bal level">level</span>'
          : `<span class="bal ${s.balance > 0 ? 'up' : 'down'}">${s.balance > 0 ? '+' : '−'}${fmtH(Math.abs(s.balance))}</span>`);
      return `<div class="brow">
        <div class="bhead">
          <span class="bname"><span class="av sm" style="background:${colourOf(p.icon)}">${iconOf(p.icon)}</span>${esc(p.name)}</span>
          <span class="bnums">${fmtH(s.paid)} ${diff}</span>
        </div>
        <div class="btrack"><i style="width:${Math.max(1.5,(s.paid/most)*100)}%;background:${colourOf(p.icon)}"></i></div>
      </div>`;
    }).join('');

  const transfers = conf.basis === 'none' ? [] : Money.levellingTransfers(summary);
  $('levelBox').hidden = transfers.length === 0;
  $('levelList').innerHTML = transfers.map(t => {
    const from = personById(t.from), to = personById(t.to);
    return from && to
      ? `<div class="lrow"><span>${esc(from.name)} → ${esc(to.name)}</span><span>${fmtH(t.amount)}</span></div>` : '';
  }).join('');

  $('basis').value = conf.basis;
  $('rate').value = String(conf.fxRate);
  const when = conf.fxAt ? new Date(conf.fxAt).toLocaleDateString('en-GB') : null;
  $('rateNote').textContent = conf.fxSource === 'manual' ? 'Set by hand.'
    : when ? `From the European Central Bank, ${when}.` : 'Using a rough default until a rate can be fetched.';
}

function render(){
  renderPot();
  if (view === 'spend') renderSpend(); else renderBalance();
  $('viewSpend').hidden = view !== 'spend';
  $('viewBalance').hidden = view !== 'balance';
  $('tabSpend').classList.toggle('on', view === 'spend');
  $('tabBalance').classList.toggle('on', view === 'balance');
  $('tabSpend').setAttribute('aria-selected', String(view === 'spend'));
  $('tabBalance').setAttribute('aria-selected', String(view === 'balance'));
}

$('tabSpend').addEventListener('click', () => { view = 'spend'; render(); });
$('tabBalance').addEventListener('click', () => { view = 'balance'; render(); });

$('phaseFilters').addEventListener('click', e => {
  const b = e.target.closest('.pill');
  if (!b) return;
  phase = b.dataset.phase;
  [...$('phaseFilters').children].forEach(x => x.classList.toggle('on', x === b));
  render();
});

/* ------------------------------------------------------------- the form */

function renderPayers(){
  const chips = people.map(p =>
    `<button type="button" class="who-chip${draft.paidBy === p.id ? ' on' : ''}" data-id="${esc(p.id)}">
       <span class="av sm" style="background:${colourOf(p.icon)}">${iconOf(p.icon)}</span>${esc(p.name)}
     </button>`).join('');
  $('fPayers').innerHTML = chips +
    `<button type="button" class="who-chip newp${draft.paidBy === '__new' ? ' on' : ''}" data-id="__new">
       <span class="plus">＋</span>${people.length ? 'Someone else' : 'Add the first person'}
     </button>`;
  $('fNewName').hidden = draft.paidBy !== '__new';
}

function renderTags(){
  $('fTags').innerHTML = TAGS.map(t =>
    `<button type="button" class="pill${draft.category === t ? ' on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
}

function renderSomePick(){
  const chosen = new Set(draft.beneficiaries || []);
  $('somePick').innerHTML = people.filter(p => p.counts).map(p =>
    `<button type="button" class="who-chip${chosen.has(p.id) ? ' on' : ''}" data-id="${esc(p.id)}">
       <span class="av sm" style="background:${colourOf(p.icon)}">${iconOf(p.icon)}</span>${esc(p.name)}
     </button>`).join('') || '<p class="set-note">Nobody to choose from yet.</p>';
}

function setForWho(some){
  $('forAll').classList.toggle('on', !some);
  $('forSome').classList.toggle('on', some);
  $('somePick').hidden = !some;
  if (!some) draft.beneficiaries = null;
  else if (!draft.beneficiaries) draft.beneficiaries = [];
}

function updateForm(){
  const parsed = Money.parseAmount($('fAmount').value);
  const rate = Number(conf.fxRate);
  let conv = '';
  if (parsed !== null) {
    conv = draft.currency === 'EUR'
      ? `≈ ${fmtH(Money.toHome(parsed, rate))}`
      : `≈ ${fmtL(Money.toLocal(parsed, rate))}`;
  } else if ($('fAmount').value.trim()) {
    conv = "Can't read that — try 12,50";
  }
  $('fConv').textContent = conv;

  const when = $('fWhen').value || todayISO();
  $('fPhase').textContent = phaseOf(when) === 'pre_trip' ? 'Counted as before we go.' : 'Counted as out there.';

  const payerOk = draft.paidBy === '__new' ? $('fNewName').value.trim().length > 0 : Boolean(draft.paidBy);
  const someButNobody = $('forSome').classList.contains('on') &&
                        (!draft.beneficiaries || draft.beneficiaries.length === 0);
  $('fSave').disabled = parsed === null || parsed === 0 || !payerOk || !draft.category || someButNobody;
}

function openForm(existing){
  people = loadPeople();
  const lastPayer = read(K_ME, null);
  draft = existing ? Object.assign({}, existing) : {
    id: null, category: null, what: '', currency: 'EUR',
    paidBy: personById(lastPayer) ? lastPayer : (people[0] ? people[0].id : '__new'),
    spentOn: todayISO(), beneficiaries: null,
  };

  $('fTitle').textContent = existing ? 'Edit spend' : 'Add spend';
  $('fDelete').hidden = !existing;
  $('fAmount').value = existing ? String(existing.currency === 'GBP' ? existing.amountHome : existing.amountLocal) : '';
  $('fDetail').value = draft.what || '';
  $('fWhen').value = draft.spentOn;
  $('fNewName').value = '';
  [...$('fCcy').children].forEach(b => b.classList.toggle('on', b.dataset.ccy === draft.currency));
  renderPayers(); renderTags();
  setForWho(Boolean(draft.beneficiaries && draft.beneficiaries.length));
  renderSomePick();
  updateForm();

  $('sheet').classList.add('open');
  document.body.classList.add('picking');
  document.querySelector('.bar').hidden = true;
}

function closeForm(){
  $('sheet').classList.remove('open');
  document.body.classList.remove('picking');
  document.querySelector('.bar').hidden = false;
  draft = null;
}

$('addBtn').addEventListener('click', () => openForm(null));
$('fCancel').addEventListener('click', closeForm);
$('fAmount').addEventListener('input', updateForm);
$('fDetail').addEventListener('input', () => { draft.what = $('fDetail').value; });
$('fNewName').addEventListener('input', updateForm);
$('fWhen').addEventListener('change', updateForm);

$('fCcy').addEventListener('click', e => {
  const b = e.target.closest('.ccy-b');
  if (!b) return;
  draft.currency = b.dataset.ccy;
  [...$('fCcy').children].forEach(x => x.classList.toggle('on', x === b));
  updateForm();
});

$('fPayers').addEventListener('click', e => {
  const b = e.target.closest('.who-chip');
  if (!b) return;
  draft.paidBy = b.dataset.id;
  renderPayers();
  if (draft.paidBy === '__new') $('fNewName').focus();
  updateForm();
});

$('fTags').addEventListener('click', e => {
  const b = e.target.closest('.pill');
  if (!b) return;
  draft.category = b.dataset.tag;
  renderTags();
  updateForm();
});

$('forAll').addEventListener('click', () => { setForWho(false); updateForm(); });
$('forSome').addEventListener('click', () => { setForWho(true); renderSomePick(); updateForm(); });

$('somePick').addEventListener('click', e => {
  const b = e.target.closest('.who-chip');
  if (!b) return;
  const list = new Set(draft.beneficiaries || []);
  list.has(b.dataset.id) ? list.delete(b.dataset.id) : list.add(b.dataset.id);
  draft.beneficiaries = [...list];
  renderSomePick();
  updateForm();
});

$('fSave').addEventListener('click', () => {
  const typed = Money.parseAmount($('fAmount').value);
  if (typed === null || typed === 0 || !draft.category) return;

  // An unknown payer is just a name. Create the person here rather than sending
  // anyone off to make a profile first — they land on the calendar spanning the
  // whole fortnight and can narrow their dates on the front page later.
  let payer = draft.paidBy;
  if (payer === '__new') {
    const name = $('fNewName').value.trim();
    if (!name) return;
    const already = people.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (already) payer = already.id;
    else {
      const rec = { id: Sync.newId(), name, icon: freeIcon(), from: TRIP.start, to: TRIP.end };
      Sync.savePerson(rec);
      people = loadPeople();
      payer = rec.id;
    }
  }

  const rate = Number(conf.fxRate);
  const currency = draft.currency;
  const spentOn = $('fWhen').value || todayISO();

  // Both figures are computed and stored now, so a later change to the rate
  // never rewrites what an old entry cost.
  const rec = {
    id: draft.id || Sync.newId(),
    category: draft.category,
    what: $('fDetail').value.trim(),
    paidBy: payer,
    spentOn,
    phase: phaseOf(spentOn),
    currency,
    amountLocal: currency === 'EUR' ? typed : Money.toLocal(typed, rate),
    amountHome:  currency === 'EUR' ? Money.toHome(typed, rate) : typed,
    fxRateUsed: rate,
    beneficiaries: draft.beneficiaries && draft.beneficiaries.length ? draft.beneficiaries : null,
    createdAt: draft.createdAt || Date.now(),
  };

  expenses = Sync.saveExpense(rec);
  write(K_ME, payer);          // remembered as next time's default
  closeForm();
  render();
});

$('fDelete').addEventListener('click', () => {
  Sync.removeExpense(draft.id);
  expenses = Sync.expenses();
  closeForm();
  render();
});

$('spendList').addEventListener('click', e => {
  const row = e.target.closest('.erow');
  if (!row) return;
  const found = expenses.find(x => x.id === row.dataset.id);
  if (found) openForm(found);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeForm();
});

/* ---------------------------------------------------------- settings */

$('basis').addEventListener('change', () => { conf.basis = $('basis').value; write(K_CONF, conf); render(); });
$('rate').addEventListener('change', () => {
  const v = Money.parseAmount($('rate').value);
  if (v !== null && v > 0) { conf.fxRate = v; conf.fxSource = 'manual'; conf.fxAt = Date.now(); write(K_CONF, conf); }
  render();
});

/* A real rate if ours is missing or a day old. Keyless, and entirely optional —
   a failure just leaves the stored rate alone. */
(async function refreshRate(){
  if (conf.fxSource === 'manual') return;
  if (conf.fxAt && (Date.now() - conf.fxAt) < 86400000) return;
  try {
    const res = await fetch('https://api.frankfurter.app/latest?from=EUR&to=GBP');
    if (!res.ok) return;
    const body = await res.json();
    const rate = body && body.rates && body.rates.GBP;
    if (typeof rate === 'number' && rate > 0) {
      conf.fxRate = Math.round(rate * 10000) / 10000;
      conf.fxAt = Date.now(); conf.fxSource = 'ecb';
      write(K_CONF, conf);
      render();
    }
  } catch {}
})();

/* ------------------------------------------------------------- theme */
(function(){
  const root = document.documentElement;
  const b = { light: $('t-light'), dark: $('t-dark'), auto: $('t-auto') };
  const set = m => {
    if (m === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', m);
    try { localStorage.setItem('laperdrix.theme', m); } catch {}
    for (const k in b) b[k].setAttribute('aria-pressed', String(k === m));
  };
  for (const k in b) b[k].addEventListener('click', () => set(k));
  let saved = 'auto';
  try { saved = localStorage.getItem('laperdrix.theme') || 'auto'; } catch {}
  set(saved);
})();

render();

/* Pick up whatever anyone else has added. What's stored is already on screen. */
(async function refresh(){
  const got = await Sync.pull();
  if (!got) return;
  people = loadPeople();
  expenses = Sync.expenses();
  render();
})();
</script>
</body>
</html>
